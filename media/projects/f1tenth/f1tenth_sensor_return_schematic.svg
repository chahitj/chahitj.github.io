<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="title desc">
  <title id="title">Schematic of unreliable LiDAR returns at a barrier</title>
  <desc id="desc">A car faces a continuous physical barrier. Two illustrative rays terminate at the barrier, while a central sector has an unreliable or missing return.</desc>
  <rect width="320" height="180" fill="#fff" />
  <rect x="0.5" y="0.5" width="319" height="179" fill="none" stroke="#dce1e6" />
  <text x="16" y="24" fill="#4c5663" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.08em">SCHEMATIC · NO RECORDED SCAN</text>

  <rect x="267" y="44" width="8" height="103" fill="#171c23" />
  <text x="229" y="163" fill="#171c23" font-family="system-ui, sans-serif" font-size="13">Barrier</text>

  <rect x="38" y="88" width="42" height="26" rx="3" fill="#e6ebef" stroke="#171c23" stroke-width="1.5" />
  <path d="M80 92 L87 101 L80 110" fill="none" stroke="#171c23" stroke-width="1.5" />
  <circle cx="82" cy="101" r="3" fill="#171c23" />
  <text x="36" y="132" fill="#171c23" font-family="system-ui, sans-serif" font-size="13">LiDAR</text>

  <path d="M86 100 L267 59 M86 102 L267 133" fill="none" stroke="#78828d" stroke-width="1.5" />
  <circle cx="267" cy="59" r="3" fill="#171c23" />
  <circle cx="267" cy="133" r="3" fill="#171c23" />
  <path d="M86 101 L217 98" fill="none" stroke="#1749cb" stroke-width="2" stroke-dasharray="5 5" />
  <path d="M215 91 L227 103 M227 91 L215 103" fill="none" stroke="#1749cb" stroke-width="2" />
  <text x="102" y="59" fill="#1749cb" font-family="system-ui, sans-serif" font-size="13">Unreliable return</text>
</svg>
