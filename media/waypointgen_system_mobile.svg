<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 555" role="img" aria-labelledby="title desc">
  <title id="title">WaypointGen global and local planning</title>
  <desc id="desc">An instruction is grounded in a crop-row graph for global waypoints. Local RGB-D perception and MPPI candidates support language-conditioned path selection.</desc>
  <rect x="1" y="1" width="358" height="553" rx="12" fill="#f7f9fc" stroke="#dce4ed" stroke-width="2"/>
  <g font-family="system-ui, sans-serif">
    <text x="18" y="34" fill="#1749cb" font-size="12" font-weight="700" letter-spacing="1">GLOBAL ROUTE + LOCAL PATH</text>
    <rect x="18" y="52" width="324" height="50" rx="7" fill="#1d3e91"/>
    <text x="180" y="83" text-anchor="middle" fill="white" font-size="16" font-weight="650">Language instruction</text>
    <path d="M180 102v22" stroke="#7288a7" stroke-width="2"/>
    <rect x="18" y="126" width="324" height="175" rx="9" fill="#fff" stroke="#9db7e8" stroke-width="2"/>
    <text x="34" y="151" fill="#1749cb" font-size="12" font-weight="700" letter-spacing="1">GLOBAL STRUCTURE</text>
    <text x="34" y="184" fill="#1d2b3e" font-size="17" font-weight="700">Overhead crop rows</text>
    <text x="34" y="215" fill="#506175" font-size="15">Aisles and endpoints → spatial graph</text>
    <text x="34" y="263" fill="#1749cb" font-size="16" font-weight="650">Qwen-guided waypoints</text>
    <path d="M180 302v27" stroke="#7288a7" stroke-width="2"/>
    <path d="m174 324 6 7 6-7" fill="none" stroke="#7288a7" stroke-width="2"/>
    <rect x="18" y="337" width="324" height="175" rx="9" fill="#fff" stroke="#9ed7c6" stroke-width="2"/>
    <text x="34" y="363" fill="#14745a" font-size="12" font-weight="700" letter-spacing="1">LOCAL GEOMETRY</text>
    <text x="34" y="396" fill="#1d2b3e" font-size="17" font-weight="700">RGB-D → semantic BEV</text>
    <text x="34" y="427" fill="#506175" font-size="15">MPPI path candidates</text>
    <text x="34" y="474" fill="#14745a" font-size="16" font-weight="650">Language-conditioned selection</text>
    <text x="180" y="539" text-anchor="middle" fill="#506175" font-size="13">Global waypoints guide local selection.</text>
  </g>
</svg>
